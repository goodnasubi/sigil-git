name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # テストに使う Sigil コンパイラの固定版（goodnasubi/sigil の main コミット SHA）。
  SIGIL_REF: 33467e3b43238fdc69331c58a788c95f1de393e5

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Sigil コンパイラ（固定版）の取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: goodnasubi/sigil
          ref: ${{ env.SIGIL_REF }}
          path: sigil-compiler

      - name: Rust stable
        id: rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          echo "rustc=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: ネイティブ出力の前提
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc git libc6-dev make zlib1g-dev

      - name: 第5段の比較用 Git の取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: git/git
          ref: 564d0252ca632e0264ed670534a51d18a689ef5d # v2.43.0
          path: stage5-git-src
          persist-credentials: false

      - name: 第5段の比較用 Git のビルド
        working-directory: stage5-git-src
        run: |
          make -j"$(nproc)" prefix="$RUNNER_TEMP/stage5-git" \
            NO_CURL=YesPlease NO_EXPAT=YesPlease NO_GETTEXT=YesPlease \
            NO_OPENSSL=YesPlease NO_PERL=YesPlease NO_TCLTK=YesPlease install
          "$RUNNER_TEMP/stage5-git/bin/git" --version

      - name: キャッシュの復元
        id: cache
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sigil-compiler/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ env.SIGIL_REF }}-${{ hashFiles('sigil-compiler/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ env.SIGIL_REF }}-

      - name: Sigil コンパイラのビルド
        run: cargo build --locked --release --bin sigil
        working-directory: sigil-compiler

      - name: test（test.sh、全量）
        run: ./test.sh
        env:
          SIGIL: ${{ github.workspace }}/sigil-compiler/target/release/sigil
          SIGIL_REF: ${{ env.SIGIL_REF }}
          STAGE5_GIT: ${{ runner.temp }}/stage5-git/bin/git
          STAGE5_GIT_VERSION: 2.43.0

      - name: キャッシュの保存
        if: ${{ !cancelled() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sigil-compiler/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ env.SIGIL_REF }}-${{ hashFiles('sigil-compiler/Cargo.lock') }}
